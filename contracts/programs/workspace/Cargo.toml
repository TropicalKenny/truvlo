[package]
name = "workspace"
version = "0.1.0"
description = "Truvlo escrow smart contract"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "workspace"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["associated_token"] }

[dev-dependencies]
anchor-client = "0.32.1"
