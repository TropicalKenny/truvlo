<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/truvlo-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Truvlo - Escrow Infrastructure for Agentic Commerce</title>
    <meta name="description" content="Programmable escrow for AI agents, freelancers, and cross-border internet work on Solana devnet, with AI-assisted trust workflows and human-reviewed disputes." />

    <!-- Open Graph -->
    <meta property="og:title" content="Truvlo - Escrow Infrastructure for Agentic Commerce" />
    <meta property="og:description" content="Programmable escrow for AI agents, freelancers, and cross-border internet work on Solana devnet." />
    <meta property="og:url" content="https://truvlo.app" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://truvlo.app/truvlo-og.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Truvlo - Escrow Infrastructure for Agentic Commerce" />
    <meta name="twitter:description" content="Programmable escrow for AI agents, freelancers, and cross-border internet work." />
    <meta name="twitter:image" content="https://truvlo.app/truvlo-og.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://truvlo.app" />

    <!-- Fonts: preconnect first, then load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />

    <!-- DNS prefetch for Solana/Pyth -->
    <link rel="dns-prefetch" href="//api.devnet.solana.com" />
    <link rel="dns-prefetch" href="//hermes.pyth.network" />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />

    <!-- Organization schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Truvlo",
      "url": "https://truvlo.app",
      "description": "Escrow infrastructure for agentic commerce on Solana devnet"
    }
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
